# Production stack on ONE server. Only nginx publishes ports. Usage: see docs/DEPLOYMENT.md
x-app: &app
  env_file: .env.production
  restart: unless-stopped
  depends_on:
    migrate: {condition: service_completed_successfully}
    redis: {condition: service_healthy}
  logging: {driver: json-file, options: {max-size: "20m", max-file: "5"}}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env.production
    environment: {POSTGRES_USER: app, POSTGRES_DB: app}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U app -d app"], interval: 10s, timeout: 5s, retries: 10}
  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck: {test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"], interval: 10s, timeout: 5s, retries: 10}
    environment: {REDIS_PASSWORD: "${REDIS_PASSWORD}"}
  migrate:                       # runs once per deploy, before the app starts
    build: ./backend
    env_file: .env.production
    command: ["alembic", "upgrade", "head"]
    depends_on: {db: {condition: service_healthy}}
  backend:
    <<: *app
    build: ./backend
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/ready').status==200 else 1)"], interval: 30s, timeout: 10s, retries: 3}
  worker:
    <<: *app
    build: ./backend
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-l", "info", "-Q", "default", "-c", "4"]
  beat:
    <<: *app
    build: ./backend
    command: ["celery", "-A", "app.worker.celery_app", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]
  frontend:
    build: {context: ./frontend, args: {BACKEND_URL: "http://backend:8000"}}
    restart: unless-stopped
    environment: {BACKEND_URL: "http://backend:8000"}
  nginx:
    image: nginx:1.27
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: {DOMAIN: "${DOMAIN}"}
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
      - ./infrastructure/nginx/entrypoint.sh:/entrypoint.sh:ro
      - certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on: [backend, frontend]
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes: [certs:/etc/letsencrypt, certbot_www:/var/www/certbot]
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
  backup:                        # nightly pg_dump, encrypted, pruned, optionally copied to object storage
    image: postgres:16
    restart: unless-stopped
    env_file: .env.production
    environment: {PGHOST: db, PGUSER: app, PGDATABASE: app, BACKUP_DIR: /backups}
    volumes:
      - ./infrastructure/backup:/scripts:ro
      - backups:/backups
    entrypoint: ["/bin/sh", "-c", "while :; do /scripts/backup.sh || echo 'BACKUP FAILED'; sleep 86400; done"]
    depends_on: {db: {condition: service_healthy}}

volumes: {pgdata: {}, redisdata: {}, certs: {}, certbot_www: {}, backups: {}}
