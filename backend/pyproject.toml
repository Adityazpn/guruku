[project]
name = "ai-education-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "redis>=5.0",
  "celery>=5.3",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "email-validator>=2.1",
  "cryptography>=42",
  "httpx>=0.27",
  "jinja2>=3.1",
  "jsonschema>=4.21",
  "python-docx>=1.1",
  "reportlab>=4.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4", "pypdf>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E501"]  # B008: FastAPI Depends() idiom; E501: long email-body strings
